<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมทายสำนวนไทยจากภาพปริศนา</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --secondary: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 10px 16px;
            border-radius: 12px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .stat-value.score {
            color: #facc15;
        }

        .image-card-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }

        .game-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
            background: #0f172a;
            padding: 3px;
        }

        .tile {
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tile:active {
            transform: scale(0.92);
        }

        .tile.opened {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8) rotateY(90deg);
        }

        .meaning-box {
            background: rgba(255, 255, 255, 0.04);
            border-left: 4px solid var(--secondary);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #e2e8f0;
            min-height: 58px;
            display: flex;
            align-items: center;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-option {
            background: #334155;
            color: #f8fafc;
            border: 2px solid transparent;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-option:active {
            transform: scale(0.98);
        }

        .btn-option.correct {
            background: #059669 !important;
            border-color: #34d399 !important;
        }

        .btn-option.wrong {
            background: #dc2626 !important;
            border-color: #f87171 !important;
        }

        .hidden {
            display: none !important;
        }

        .result-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .result-title {
            font-size: 1.8rem;
            color: #facc15;
        }

        .total-score {
            font-size: 3rem;
            font-weight: 700;
            color: #38bdf8;
            margin: 10px 0;
        }

        .answers-list {
            max-height: 320px;
            overflow-y: auto;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 6px;
        }

        .answer-item {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .answer-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            background: #000;
        }

        .answer-info {
            flex: 1;
        }

        .answer-title {
            font-weight: 700;
            color: #38bdf8;
            font-size: 0.95rem;
        }

        .answer-desc {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .btn-restart {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
        }

        .answers-list::-webkit-scrollbar {
            width: 6px;
        }
        .answers-list::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Play Screen -->
        <div id="play-screen">
            <div class="header">
                <div class="stat-box">
                    <span class="stat-label">ข้อที่</span>
                    <span class="stat-value" id="current-question">1/16</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">คะแนนข้อนี้</span>
                    <span class="stat-value" id="round-score">1200</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">คะแนนรวม</span>
                    <span class="stat-value score" id="total-score">0</span>
                </div>
            </div>

            <div class="image-card-wrapper" style="margin-top: 12px;">
                <img id="game-image" class="game-image" src="" alt="ภาพปริศนา">
                <div id="grid-overlay" class="grid-overlay"></div>
            </div>

            <div class="meaning-box" style="margin-top: 12px;">
                <span id="meaning-text">คำแปล: -</span>
            </div>

            <div class="options-grid" style="margin-top: 12px;" id="options-container"></div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="result-screen hidden">
            <h2 class="result-title">🎉 สรุปผลการเล่น 🎉</h2>
            <div>
                <div style="color: #94a3b8; font-size: 0.9rem;">คะแนนรวมทั้งหมดของคุณ</div>
                <div class="total-score" id="final-score">0</div>
            </div>

            <h3 style="text-align: left; font-size: 1.1rem; color: #f8fafc; margin-top: 10px;">เฉลยสำนวนทั้งหมด</h3>
            <div class="answers-list" id="answers-list"></div>

            <button class="btn-restart" onclick="restartGame()">🔄 เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

    <script>
        const rawData = [
    { title: "กระต่ายหมายจันทร์", meaning: "ผู้ชายที่หมายปองหญิงสูงศักดิ์ ฐานะดีกว่าตัวเอง", img: "./Rabit.png" },
    { title: "กระโถนท้องพระโรง", meaning: "บุคคลที่ถูกใคร ๆ รุมใช้อยู่คนเดียว", img: "./Spit.jpg" },
    { title: "กิ่งทองใบหยก", meaning: "ชายหนุ่ม หญิงสาวเหมาะสมกันดีที่จะแต่งงาน", img: "./Gold_stick.jpg" },
    { title: "กินที่ลับไขที่แจ้ง", meaning: "เอาความลับหรือเอาเรื่องที่ทำกันที่ลับมาเปิดเผยให้คนเขารู้", img: "./Hide_and_open.jpg" },
    { title: "กินน้ำใต้ศอก", meaning: "เมียน้อยต้องยอมรับของเหลือจากเมียหลวง ตกเป็นรองด้านศักดิ์ศรี", img: "./Elbow.jpg" },
    { title: "ขุดด้วยปาก ถากด้วยตา", meaning: "เหยียดหยามทั้งคำพูด และสายตามองแบบดูถูก", img: "./Mouth_and_eyes.jpg" },
    { title: "ขุดบ่อล่อปลา", meaning: "ทำกลอุบายให้เขาเชื่อเพื่อหวังผลประโยชน์", img: "./Fish.jpg" },
    { title: "จับเสือมือเปล่า", meaning: "หาผลประโยชน์โดยตัวเองไม่ลงทุน", img: "./Tiger.png" },
    { title: "จุดไต้ตำตอ", meaning: "พูดหรือทำบังเอิญไปโดนเจ้าของเรื่องโดยผู้พูดนั้นไม่รู้ตัว", img: "./Kick_log.jpg" },
    { title: "ตื่นแต่ดึก สึกแต่หนุ่ม", meaning: "เร่งรัดเกินไปในเวลาที่ยังไม่เหมาะสม", img: "./Bye.jpg" },
    { title: "ละเลงขนมเบื้องด้วยปาก", meaning: "ดีแต่พูด แต่ทำจริง ๆ ทำไม่ได้", img: "./Khanom.jpg" },
    { title: "สิ้นไร้ไม้ตอก", meaning: "ยากไร้ ขัดสนถึงที่สุด ไม่มีทรัพย์สมบัติติดตัว", img: "./No_hitting_stick.jpg" },
    { title: "หยิกเล็บเจ็บเนื้อ", meaning: "เมื่อทำความเดือดร้อนให้แก่คนใกล้ชิด ก็จะมีผลกระทบถึงตัวผู้ทำหรือพวกพ้อง", img: "./Pinch.jpg" },
    { title: "เอาไม้ซีกไปงัดไม้ซุง", meaning: "คัดค้านผู้มีอำนาจ ฐานะสูงกว่า หรือผู้ใหญ่กว่า มักจะล้มเหลว", img: "./Stick_and_log.jpg" },
    { title: "ศรศิลป์ไม่กินกัน", meaning: "ไม่ถูกกัน ไม่ลงรอยกัน ไม่ชอบหน้ากัน", img: "./Arrow.jpg" },
    { title: "สร้างวิมานในอากาศ", meaning: "คิดคาดหวัง จะมีจะเป็นอะไรอย่างเลิศลอย", img: "./Imagine.jpg" }
];

        let currentIdx = 0;
        let totalScore = 0;
        let currentRoundScore = 1200;
        let isAnswering = false;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function initQuestion() {
            if (currentIdx >= rawData.length) {
                showResult();
                return;
            }

            isAnswering = false;
            currentRoundScore = 1200;
            updateStats();

            const item = rawData[currentIdx];
            document.getElementById('game-image').src = item.img;
            document.getElementById('meaning-text').innerText = "คำแปล: " + item.meaning;

            const grid = document.getElementById('grid-overlay');
            grid.innerHTML = '';
            for (let i = 1; i <= 12; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = i;
                tile.onclick = function() {
                    if (!this.classList.contains('opened') && !isAnswering) {
                        this.classList.add('opened');
                        currentRoundScore = Math.max(0, currentRoundScore - 100);
                        updateStats();
                    }
                };
                grid.appendChild(tile);
            }

            const allTitles = rawData.map(d => d.title);
            const wrongOptions = allTitles.filter(t => t !== item.title);
            const shuffledWrong = shuffle(wrongOptions).slice(0, 2);
            const options = shuffle([item.title, ...shuffledWrong]);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, item.title, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function updateStats() {
            document.getElementById('current-question').innerText = `${currentIdx + 1}/${rawData.length}`;
            document.getElementById('round-score').innerText = currentRoundScore;
            document.getElementById('total-score').innerText = totalScore;
        }

        function checkAnswer(selected, correct, btnElement) {
            if (isAnswering) return;
            isAnswering = true;

            const tiles = document.querySelectorAll('.tile');
            tiles.forEach(t => t.classList.add('opened'));

            const buttons = document.querySelectorAll('.btn-option');
            
            if (selected === correct) {
                btnElement.classList.add('correct');
                totalScore += currentRoundScore;
            } else {
                btnElement.classList.add('wrong');
                buttons.forEach(b => {
                    if (b.innerText === correct) b.classList.add('correct');
                });
            }

            updateStats();

            setTimeout(() => {
                currentIdx++;
                initQuestion();
            }, 1800);
        }

        function showResult() {
            document.getElementById('play-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = totalScore;

            const list = document.getElementById('answers-list');
            list.innerHTML = '';
            rawData.forEach(item => {
                const el = document.createElement('div');
                el.className = 'answer-item';
                el.innerHTML = `
                    <img src="${item.img}" alt="${item.title}">
                    <div class="answer-info">
                        <div class="answer-title">${item.title}</div>
                        <div class="answer-desc">${item.meaning}</div>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        function restartGame() {
            currentIdx = 0;
            totalScore = 0;
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('play-screen').classList.remove('hidden');
            initQuestion();
        }

        initQuestion();
    </script>
</body>
</html>
